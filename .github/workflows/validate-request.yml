name: Validate Request

on:
  push:
    branches:
      - requests

permissions:
  contents: read

jobs:
  validate:
    name: Validate request files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' CHANGES < <(
            git diff \
              --name-status \
              -z \
              --find-renames \
              origin/main...HEAD
          )

          FILE_COUNT=0
          INDEX=0

          while [ "$INDEX" -lt "${#CHANGES[@]}" ]; do
            STATUS="${CHANGES[$INDEX]}"
            INDEX=$((INDEX + 1))

            # En renombrados y copias, Git devuelve ruta antigua y nueva.
            if [[ "$STATUS" == R* || "$STATUS" == C* ]]; then
              OLD_FILE="${CHANGES[$INDEX]}"
              NEW_FILE="${CHANGES[$((INDEX + 1))]}"
              INDEX=$((INDEX + 2))

              echo "No se permite renombrar o copiar archivos:"
              echo "Origen: $OLD_FILE"
              echo "Destino: $NEW_FILE"
              exit 1
            fi

            FILE="${CHANGES[$INDEX]}"
            INDEX=$((INDEX + 1))
            FILE_COUNT=$((FILE_COUNT + 1))

            echo "Validando cambio: $STATUS $FILE"

            if [ "$STATUS" = "D" ]; then
              echo "No se permite borrar archivos: $FILE"
              exit 1
            fi

            if [ "$STATUS" != "A" ] && [ "$STATUS" != "M" ]; then
              echo "Tipo de cambio no permitido: $STATUS $FILE"
              exit 1
            fi

            case "$FILE" in
              ejercicios/*.json|imagenes/*.json)
                ;;

              *)
                echo "Solo se permiten archivos JSON en ejercicios/ o imagenes/: $FILE"
                exit 1
                ;;
            esac
          done

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No hay diferencias entre request y main"
            exit 0
          fi

          if [ "$FILE_COUNT" -gt 20 ]; then
            echo "Demasiados archivos modificados: $FILE_COUNT"
            echo "El máximo permitido es 20"
            exit 1
          fi

          echo "Número de archivos modificados: $FILE_COUNT"

      - name: Validate changed JSON files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' FILE; do
            if [ ! -f "$FILE" ]; then
              continue
            fi

            echo "Validando JSON: $FILE"

            if ! jq empty "$FILE"; then
              echo "JSON inválido: $FILE"
              exit 1
            fi
          done < <(
            git diff \
              --name-only \
              --diff-filter=AM \
              -z \
              origin/main...HEAD \
              -- "*.json"
          )

          echo "Todos los archivos JSON modificados son válidos"
