name: Validate Request

on:
  push:
    branches:
      - requests

permissions:
  contents: read

jobs:
  validate:
    name: Validate request files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' CHANGES < <(
            git diff \
              --name-status \
              -z \
              --find-renames \
              origin/main...HEAD
          )

          FILE_COUNT=0
          INDEX=0

          UUID_PATTERN='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

          is_legacy_file() {
            [[ "$1" =~ ^ejercicios/$UUID_PATTERN\.json$ || "$1" =~ ^imagenes/$UUID_PATTERN\.json$ ]]
          }

          is_new_file() {
            local FILE="$1"

            if [[ "$FILE" =~ ^ejercicios/($UUID_PATTERN)/($UUID_PATTERN)\.json$ ]]; then
              [[ "${BASH_REMATCH[1]}" == "${BASH_REMATCH[2]}" ]]
            else
              [[ "$FILE" =~ ^ejercicios/$UUID_PATTERN/imagenes/$UUID_PATTERN\.json$ ]]
            fi
          }

          while [ "$INDEX" -lt "${#CHANGES[@]}" ]; do
            STATUS="${CHANGES[$INDEX]}"
            INDEX=$((INDEX + 1))

            # En renombrados y copias, Git devuelve ruta antigua y nueva.
            if [[ "$STATUS" == R* || "$STATUS" == C* ]]; then
              OLD_FILE="${CHANGES[$INDEX]}"
              NEW_FILE="${CHANGES[$((INDEX + 1))]}"
              INDEX=$((INDEX + 2))

              if [[ "$STATUS" == R* ]] && is_legacy_file "$OLD_FILE" && is_new_file "$NEW_FILE"; then
                FILE_COUNT=$((FILE_COUNT + 1))
                echo "Validando renombrado: $OLD_FILE -> $NEW_FILE"
                continue
              fi

              echo "No se permite copiar este archivo ni realizar este renombrado:"
              echo "Origen: $OLD_FILE"
              echo "Destino: $NEW_FILE"
              exit 1
            fi

            FILE="${CHANGES[$INDEX]}"
            INDEX=$((INDEX + 1))
            FILE_COUNT=$((FILE_COUNT + 1))

            echo "Validando cambio: $STATUS $FILE"

            if [ "$STATUS" = "D" ]; then
              echo "No se permite borrar archivos: $FILE"
              exit 1
            fi

            if [ "$STATUS" != "A" ] && [ "$STATUS" != "M" ]; then
              echo "Tipo de cambio no permitido: $STATUS $FILE"
              exit 1
            fi

            if [[ "$FILE" != "categorias.json" ]] && ! is_legacy_file "$FILE" && ! is_new_file "$FILE"; then
              echo "Solo se permiten categorias.json y archivos JSON de ejercicios/imágenes en la estructura admitida: $FILE"
              exit 1
            fi
          done

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No hay diferencias entre request y main"
            exit 0
          fi

          if [ "$FILE_COUNT" -gt 1000 ]; then
            echo "Demasiados archivos modificados: $FILE_COUNT"
            echo "El máximo permitido es 1000"
            exit 1
          fi

          echo "Número de archivos modificados: $FILE_COUNT"

      - name: Validate changed JSON files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' FILE; do
            if [ ! -f "$FILE" ]; then
              continue
            fi

            echo "Validando JSON: $FILE"

            if ! jq empty "$FILE"; then
              echo "JSON inválido: $FILE"
              exit 1
            fi
          done < <(
            git diff \
              --name-only \
              --diff-filter=AMR \
              -z \
              origin/main...HEAD \
              -- "*.json"
          )

          echo "Todos los archivos JSON modificados son válidos"
