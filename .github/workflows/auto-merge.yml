name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  merge:
    if: github.event.pull_request.head.ref == 'requests'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto merge
        # Require "Validate Request / validate" in main's branch protection so --auto waits for validation.
        run: gh pr merge ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
