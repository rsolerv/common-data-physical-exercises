name: Auto Merge

on:
  pull_request:
    branches:
      - main

jobs:
  merge:
    if: >
      github.event.pull_request.head.ref == 'requests' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto merge
        run: gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
