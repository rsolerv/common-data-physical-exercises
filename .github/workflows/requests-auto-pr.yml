name: Create Pull Request

on:
  workflow_run:
    workflows:
      - Validate Request
    types:
      - completed

permissions:
  contents: read

jobs:
  create-pr:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'requests' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA=$(gh api \
            "repos/$GH_REPO/branches/requests" \
            --jq '.commit.sha')

          if [ "$CURRENT_SHA" != "$VALIDATED_SHA" ]; then
            echo "La rama requests avanzó después de la validación; se omite este PR"
            exit 0
          fi

          CHANGED_FILE_COUNT=$(gh api \
            "repos/$GH_REPO/compare/main...requests" \
            --jq '.files | length')

          if [ "$CHANGED_FILE_COUNT" -eq 0 ]; then
            echo "No hay archivos diferentes entre requests y main; no se crea un PR vacío"
            exit 0
          fi

          EXISTING_PR=$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head requests \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING_PR" -eq 0 ]; then
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head requests \
              --title "Actualizar ejercicios" \
              --body "Pull Request creado automáticamente."
          else
            echo "Ya existe un Pull Request abierto"
          fi
