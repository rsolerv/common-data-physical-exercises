name: Create Pull Request

on:
  workflow_run:
    workflows:
      - Validate Request
    types:
      - completed

permissions:
  contents: read

jobs:
  create-pr:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'requests'

    runs-on: ubuntu-latest

    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.USER_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "$GH_REPO" \
            --base main \
            --head requests \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING_PR" -eq 0 ]; then
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head requests \
              --title "Actualizar ejercicios" \
              --body "Pull Request creado automáticamente."
          else
            echo "Ya existe un Pull Request abierto"
          fi
